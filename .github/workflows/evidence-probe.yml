name: Public evidence probe

on:
  push:
    paths:
      - 'scripts/probe_public_evidence.py'
      - '.github/workflows/evidence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests beautifulsoup4 openpyxl
      - name: Probe public evidence
        run: python scripts/probe_public_evidence.py
      - name: Upload provenance-only probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-probe
          path: probe-results.json
          if-no-files-found: warn
