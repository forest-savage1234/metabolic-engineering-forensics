name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
      - name: Verify all case manifests fail closed
        run: |
          for claim in cases/*/claim.json; do
            echo "== $claim =="
            python verifier/verify.py "$claim"
          done
